name: MONA temporary original PDF upload 13

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mona_temp_upload_original_13.yml"

permissions:
  contents: write

jobs:
  upload-original:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-03e0-8206-a3d2-26ad4a86cdcf/raw?se=2026-10-23T08%3A58%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=79cfde76-7529-5cef-a1c6-f669dfafcb1b&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-22T23%3A23%3A10Z&ske=2026-10-23T23%3A23%3A10Z&sks=b&skv=2026-02-06&sig=BKst0wzHdntACAQKgoLgGcw0vBaeBY/qvah3xbbf2a0%3D'
      TARGET_PATH: 'original/13_滴天髓闡微_下/적천수천미_하.pdf'
      EXPECTED_SHA256: '85937b920c7c3d26414098ffad10f5df89c555d64523a2c2e252606ea748c9d8'
      EXPECTED_SIZE: '36035645'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact uploaded PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$TARGET_PATH")"
          curl -L --fail --retry 3 --retry-delay 2 "$SOURCE_URL" -o "$TARGET_PATH"
          echo "$EXPECTED_SHA256  $TARGET_PATH" | sha256sum -c -
          test "$(stat -c %s "$TARGET_PATH")" = "$EXPECTED_SIZE"

      - name: Commit original and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mona_temp_upload_original_13.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH" .github/workflows/mona_temp_upload_original_13.yml
          git commit -m "Add original 滴天髓闡微 lower volume PDF"
          git push origin HEAD:main
