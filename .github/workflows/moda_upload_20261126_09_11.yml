name: MODA temporary original source upload 09 and 11

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/moda_upload_20261126_09_11.yml"

permissions:
  contents: write

jobs:
  upload-original:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SOURCE_01: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-1634-8206-8bd5-ea73627b0bce/raw?se=2026-11-25T15%3A36%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=e5f415da-fd66-52bc-b4ce-c4155ae8eac7&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-24T23%3A32%3A55Z&ske=2026-11-25T23%3A32%3A55Z&sks=b&skv=2026-06-06&sig=wrZgCPjh5POXHr6Yli5D0AkLQj1lGxtWvTmBhxSE/94%3D"
      SOURCE_02: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-bcb4-8206-8ac0-34c69d6efdb0/raw?se=2026-11-25T15%3A36%3A34Z&sp=r&sv=2026-06-06&sr=b&scid=075baa58-0b2b-503a-a240-e26aa7b2430e&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-25T14%3A16%3A39Z&ske=2026-11-26T14%3A16%3A39Z&sks=b&skv=2026-06-06&sig=FGctcRQIGAp016%2BHBx2p%2BVO8FdXzGsPFaCevlJo3C00%3D"
      SOURCE_03: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-dc80-8206-8c6d-fd0738d5848a/raw?se=2026-11-25T15%3A36%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=6d70c0c9-a537-58fd-9c82-82b0d86b1138&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-25T14%3A16%3A34Z&ske=2026-11-26T14%3A16%3A34Z&sks=b&skv=2026-06-06&sig=9Yy87ZXxHyMy8LHE%2BrueQIIZylLujbUGV0%2BaohBVSSA%3D"
      SOURCE_04: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-828c-8206-bf61-ca52ba093140/raw?se=2026-11-25T15%3A36%3A33Z&sp=r&sv=2026-06-06&sr=b&scid=84cbca60-619c-5ea2-a67c-832c9f0e0b8e&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-25T01%3A12%3A25Z&ske=2026-11-26T01%3A12%3A25Z&sks=b&skv=2026-06-06&sig=dAMix3XpGAZHAmFpz2tGQoY/WDG1RK8QKkJ%2B0kj2Gm4%3D"
      SOURCE_05: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-c560-8206-b7b8-f91339a0752f/raw?se=2026-11-25T15%3A36%3A34Z&sp=r&sv=2026-06-06&sr=b&scid=b8f7f318-17d0-5230-b0e7-9b920a62b6f8&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-25T00%3A57%3A07Z&ske=2026-11-26T00%3A57%3A07Z&sks=b&skv=2026-06-06&sig=KZmMKuk5gSqezYZ4%2Bl32FwYQifXkIB7cL1sNe7EBiCs%3D"
      SOURCE_06: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-a110-8206-99a5-387a0a1fbe40/raw?se=2026-11-25T15%3A36%3A39Z&sp=r&sv=2026-06-06&sr=b&scid=c89ba144-08f1-54be-addf-c2ce105288cd&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-25T00%3A00%3A52Z&ske=2026-11-26T00%3A00%3A52Z&sks=b&skv=2026-06-06&sig=GNjUmyS5xof%2BvhbvbMHN%2BZBOdQkPjH12PdyuSryrK3I%3D"
      SOURCE_07: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-9f78-8206-a515-1ae4cc82c3c0/raw?se=2026-11-25T15%3A36%3A36Z&sp=r&sv=2026-06-06&sr=b&scid=42c5a345-65bd-59ac-a8b3-45543724f423&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-24T23%3A56%3A18Z&ske=2026-11-25T23%3A56%3A18Z&sks=b&skv=2026-06-06&sig=BskTL7BtmCuPhoULUhz6Rao4YmyRu37x5sxuDqA%2B4rs%3D"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify seven originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'original/09_五行精紀_分冊1-6' 'original/11_三命指迷賦_第1-2卷'
          target="original/09_五行精紀_分冊1-6/오행정기 1(2).pdf"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 200 "$SOURCE_01" -o "$target"
          printf '%s  %s\n' '834cb4608607edebacf0659eb17af8301d381edaf87d913089bf0baa8be22fd2' "$target" | sha256sum -c -
          test "$(stat -c %s "$target")" = "12242498"
          target="original/09_五行精紀_分冊1-6/오행정기 2(2).pdf"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 200 "$SOURCE_02" -o "$target"
          printf '%s  %s\n' '53c6c55a69f406c5fee8ddf932014215821a053ad9c77908378517d8067bea5d' "$target" | sha256sum -c -
          test "$(stat -c %s "$target")" = "16153462"
          target="original/09_五行精紀_分冊1-6/오행정기 3(2).pdf"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 200 "$SOURCE_03" -o "$target"
          printf '%s  %s\n' 'c8800a2e223634636cbd76688d76e9608e789eeba47a48c42fe5e52063550238' "$target" | sha256sum -c -
          test "$(stat -c %s "$target")" = "15434532"
          target="original/09_五行精紀_分冊1-6/오행정기 4(2).pdf"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 200 "$SOURCE_04" -o "$target"
          printf '%s  %s\n' '3d0a67d95b5dc8e05f1ccb464c9aac6b79afbaf34bbf7635a92045a02cc1b821' "$target" | sha256sum -c -
          test "$(stat -c %s "$target")" = "13216568"
          target="original/09_五行精紀_分冊1-6/오행정기 5(2).pdf"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 200 "$SOURCE_05" -o "$target"
          printf '%s  %s\n' '8bd7b86a2788155cdc76ed91673192cd4ba3b134ff56b9891e30cda8dc116559' "$target" | sha256sum -c -
          test "$(stat -c %s "$target")" = "15186181"
          target="original/09_五行精紀_分冊1-6/오행정기 6(2).pdf"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 200 "$SOURCE_06" -o "$target"
          printf '%s  %s\n' '70182a2939a52ae896be1ac8a472cd43a0215816071419edf2971f8949833ed4' "$target" | sha256sum -c -
          test "$(stat -c %s "$target")" = "10942231"
          target="original/11_三命指迷賦_第1-2卷/三命指迷賦_第2卷 p27(1).jpg"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 200 "$SOURCE_07" -o "$target"
          printf '%s  %s\n' '6e6278a4e1e1ac3c3eda6626eb7552ce5b927b903444dfa5891cc4e3bae8c0e9' "$target" | sha256sum -c -
          test "$(stat -c %s "$target")" = "240367"

      - name: Commit verified files and delete temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm '.github/workflows/moda_upload_20261126_09_11.yml'
          git add -- "original/09_五行精紀_分冊1-6/오행정기 1(2).pdf"
          git add -- "original/09_五行精紀_分冊1-6/오행정기 2(2).pdf"
          git add -- "original/09_五行精紀_分冊1-6/오행정기 3(2).pdf"
          git add -- "original/09_五行精紀_分冊1-6/오행정기 4(2).pdf"
          git add -- "original/09_五行精紀_分冊1-6/오행정기 5(2).pdf"
          git add -- "original/09_五行精紀_分冊1-6/오행정기 6(2).pdf"
          git add -- "original/11_三命指迷賦_第1-2卷/三命指迷賦_第2卷 p27(1).jpg"
          git add -- '.github/workflows/moda_upload_20261126_09_11.yml'
          git commit -m 'Add original 五行精紀 six PDFs and 三命指迷賦 page 27 image'
          git push origin HEAD:main
